<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>프로젝트 한눈에</title>
  <meta name="description" content="Git 저장소와 웹 앱을 한곳에서 열고 들어갑니다." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111714'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='%23d4a017'%3E한%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,560;9..144,640&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #111714;
      --bg-2: #171e1a;
      --card: #1c2420;
      --line: rgba(232, 239, 230, 0.08);
      --text: #e8efe6;
      --muted: #8b9a8f;
      --gold: #d4a017;
      --paper: #efe7d6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(212, 160, 23, 0.08), transparent 55%),
        radial-gradient(900px 400px at 110% 0%, rgba(14, 159, 142, 0.08), transparent 50%),
        var(--bg);
      color: var(--text);
      letter-spacing: -0.01em;
    }
    a { color: inherit; }
    .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 80px; }
    header.top {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 24px;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .kicker {
      color: var(--gold);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 640;
      line-height: 1.15;
      margin: 0;
    }
    .lede { color: var(--muted); margin: 10px 0 0; max-width: 38em; line-height: 1.55; }
    .gh {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--bg-2);
      color: var(--text);
      text-decoration: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
    }
    .gh:hover { border-color: rgba(212, 160, 23, 0.45); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 0 0 22px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip, .search {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      border-radius: 999px;
      height: 36px;
    }
    .chip {
      padding: 0 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .chip[aria-pressed="true"] {
      color: var(--bg);
      background: var(--paper);
      border-color: var(--paper);
    }
    .search {
      flex: 1 1 220px;
      min-width: 180px;
      padding: 0 14px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }
    .search:focus { border-color: var(--gold); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 18px 16px;
      display: flex;
      flex-direction: column;
      min-height: 250px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--accent, var(--gold));
    }
    .card-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    .mark {
      width: 42px; height: 42px; flex: 0 0 auto;
      border-radius: 12px;
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
      font-family: Fraunces, Georgia, serif;
      font-weight: 640;
      font-size: 16px;
    }
    .name { font-size: 18px; font-weight: 700; margin: 0; line-height: 1.25; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .pill {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .blurb {
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.55;
      margin: 0 0 14px;
      flex: 1;
    }
    .note { font-size: 11px; color: #6f7d74; margin: -6px 0 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .btn.primary {
      background: var(--accent, var(--gold));
      color: #111;
    }
    .btn.ghost {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }
    .btn.ghost:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
    .empty {
      grid-column: 1 / -1;
      color: var(--muted);
      text-align: center;
      padding: 48px 12px;
    }
    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      justify-content: space-between;
    }
    footer a { color: var(--paper); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <p class="kicker">Hyungmo1234 · GitHub</p>
        <h1>프로젝트 한눈에</h1>
        <p class="lede">매일 영어·일본어, 데일리하우스, 녹음 툴까지. 카드에서 웹과 GitHub로 바로 들어갑니다.</p>
      </div>
      <a class="gh" href="https://github.com/Hyungmo1234?tab=repositories" target="_blank" rel="noopener">GitHub 저장소 목록</a>
    </header>

    <div class="toolbar">
      <div class="chips" role="tablist" aria-label="종류">
        <button class="chip" data-kind="all" aria-pressed="true">전체</button>
        <button class="chip" data-kind="web" aria-pressed="false">웹으로 열기</button>
        <button class="chip" data-kind="tool" aria-pressed="false">로컬 도구</button>
        <button class="chip" data-kind="study" aria-pressed="false">공부·기타</button>
      </div>
      <input class="search" type="search" placeholder="이름, 설명, 저장소 검색" aria-label="검색" />
    </div>

    <section class="grid" id="grid" aria-live="polite"></section>

    <footer>
      <span>목록은 <code>projects.json</code>에서 고칩니다. GitHub API로 공개 저장소의 최근 푸시도 붙입니다.</span>
      <a href="https://github.com/Hyungmo1234/chkAPJ">이 뷰어 저장소</a>
    </footer>
  </div>

  <script>
    const KIND_LABEL = { web: "웹", tool: "로컬 도구", study: "공부" };
    const FALLBACK = {
      githubUser: "Hyungmo1234",
      skipRepos: ["kkkk", "no"],
      projects: []
    };

    const state = { kind: "all", q: "", catalog: FALLBACK, pushed: {} };

    const grid = document.getElementById("grid");
    const search = document.querySelector(".search");

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        state.kind = chip.dataset.kind;
        document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
        render();
      });
    });
    search.addEventListener("input", () => {
      state.q = search.value.trim().toLowerCase();
      render();
    });

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function relative(iso) {
      if (!iso) return "";
      const t = new Date(iso).getTime();
      if (Number.isNaN(t)) return "";
      const day = Math.round((Date.now() - t) / 86400000);
      if (day <= 0) return "오늘 푸시";
      if (day === 1) return "어제 푸시";
      if (day < 14) return day + "일 전 푸시";
      return new Date(iso).toISOString().slice(0, 10) + " 푸시";
    }

    function matches(p) {
      if (state.kind !== "all" && p.kind !== state.kind) return false;
      if (!state.q) return true;
      const blob = [p.name, p.blurb, p.gitName, p.note].join(" ").toLowerCase();
      return blob.includes(state.q);
    }

    function render() {
      const items = state.catalog.projects.filter(matches);
      if (!items.length) {
        grid.innerHTML = '<p class="empty">해당하는 프로젝트가 없습니다.</p>';
        return;
      }
      grid.innerHTML = items.map((p) => {
        const pushed = p.gitName && relative(state.pushed[p.gitName]);
        const pills = [
          KIND_LABEL[p.kind] || p.kind,
          p.private ? "private" : (p.git ? "public" : ""),
          p.local ? "PC" : "",
          pushed
        ].filter(Boolean);
        const buttons = [];
        if (p.web) {
          buttons.push(`<a class="btn primary" href="${esc(p.web)}" target="_blank" rel="noopener">${esc(p.webLabel || "웹 열기")}</a>`);
        }
        if (p.git) {
          buttons.push(`<a class="btn ghost" href="${esc(p.git)}" target="_blank" rel="noopener">GitHub</a>`);
        }
        if (p.youtube) {
          buttons.push(`<a class="btn ghost" href="${esc(p.youtube)}" target="_blank" rel="noopener">YouTube</a>`);
        }
        if (!buttons.length && p.local) {
          buttons.push(`<span class="btn ghost">로컬 폴더만 있음</span>`);
        }
        return `
          <article class="card" style="--accent:${esc(p.accent || "#d4a017")}">
            <div class="card-head">
              <div class="mark">${esc(p.mark || "·")}</div>
              <div>
                <h2 class="name">${esc(p.name)}</h2>
                <div class="meta">${pills.map((x) => `<span class="pill">${esc(x)}</span>`).join("")}</div>
              </div>
            </div>
            <p class="blurb">${esc(p.blurb)}</p>
            ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
            <div class="actions">${buttons.join("")}</div>
          </article>`;
      }).join("");
    }

    async function boot() {
      try {
        const res = await fetch("projects.json", { cache: "no-store" });
        if (res.ok) state.catalog = await res.json();
      } catch (_) { /* file:// 로 열면 JSON을 못 읽을 수 있음 */ }
      render();
      try {
        const user = state.catalog.githubUser || "Hyungmo1234";
        const res = await fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=pushed`);
        if (!res.ok) return;
        const repos = await res.json();
        const skip = new Set(state.catalog.skipRepos || []);
        const known = new Set((state.catalog.projects || []).map((p) => p.gitName).filter(Boolean));
        for (const repo of repos) {
          state.pushed[repo.name] = repo.pushed_at;
          if (skip.has(repo.name) || known.has(repo.name)) continue;
          state.catalog.projects.push({
            id: repo.name,
            name: repo.name,
            blurb: repo.description || "GitHub 공개 저장소",
            kind: repo.homepage ? "web" : "study",
            accent: "#8b9a8f",
            mark: "G",
            web: repo.homepage || "",
            webLabel: "웹 열기",
            git: repo.html_url,
            gitName: repo.name,
            private: false
          });
        }
        render();
      } catch (_) { /* API 한도·오프라인은 무시 */ }
    }

    boot();
  </script>
</body>
</html>
