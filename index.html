<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>개인 프로젝트 모음</title>
  <meta name="description" content="Git 저장소와 웹 앱을 한곳에서 열고 들어갑니다." />
  <meta name="theme-color" content="#f3efe7" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f1b16'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' font-family='serif' fill='%23f3efe7'%3E한%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <p class="kicker">
        <span>형모의 작업</span>
        <span class="nav-links">
          <button type="button" class="gh" id="admin-open">관리</button>
          <a class="gh" href="resume.html">이력서</a>
          <a class="gh" href="https://github.com/Hyungmo1234?tab=repositories" target="_blank" rel="noopener">GitHub</a>
        </span>
      </p>
      <h1>개인 프로젝트 모음</h1>
      <p class="run-banner" id="run-banner" hidden></p>
    </header>

    <div class="toolbar">
      <div class="chips" role="tablist" aria-label="종류">
        <button class="chip" data-kind="all" aria-pressed="true">전체</button>
        <button class="chip" data-kind="web" aria-pressed="false">웹</button>
        <button class="chip" data-kind="tool" aria-pressed="false">로컬 도구</button>
        <button class="chip" data-kind="study" aria-pressed="false">공부</button>
      </div>
      <input class="search" type="search" placeholder="이름, 설명, 저장소 검색" aria-label="검색" />
    </div>

    <section class="grid" id="grid" aria-live="polite"></section>
  </div>

  <footer class="site-foot">
    <div class="foot-inner">
      <div>
        <p class="foot-name">양형모</p>
        <p class="foot-role">웹 개발 경력 8년(SI · SM)<br>AI, 공정 자동화 수련중</p>
      </div>
      <div class="foot-contacts">
        <a href="tel:+821084389060">010-8438-9060</a>
        <a href="mailto:tytyrrr13@gmail.com">tytyrrr13@gmail.com</a>
        <a href="resume.html">이력서</a>
        <a href="https://github.com/Hyungmo1234" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  <div class="modal" id="edit-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="edit-title">
      <h2 id="edit-title">수정</h2>
      <div class="edit-tabs">
        <button type="button" class="chip" data-mode="edit" aria-pressed="true">바로 수정</button>
        <button type="button" class="chip" data-mode="wish" aria-pressed="false">이렇게 고쳤으면</button>
        <button type="button" class="chip" data-mode="inbox" aria-pressed="false">요청 내역</button>
      </div>
      <form id="edit-form">
        <label>비밀번호
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <div data-pane="edit">
          <label>이름
            <input type="text" name="name" />
          </label>
          <label>설명
            <textarea name="blurb" rows="4"></textarea>
          </label>
          <label>메모
            <input type="text" name="note" />
          </label>
        </div>
        <div data-pane="wish" hidden>
          <label>이렇게 고쳤으면 좋겠습니다
            <textarea name="wish" rows="5" placeholder="예: 일본어 유튜브 토큰을 다시 넣고, 오늘 슬롯부터 다시 돌렸으면"></textarea>
          </label>
        </div>
        <div data-pane="inbox" hidden>
          <div id="inbox-list" class="inbox-list">불러오는 중…</div>
        </div>
        <p class="edit-msg" id="edit-msg" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-close>닫기</button>
          <button type="submit" class="btn primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    const KIND_LABEL = { web: "웹", tool: "로컬", study: "공부" };
    const FALLBACK = {
      githubUser: "Hyungmo1234",
      skipRepos: ["kkkk", "no"],
      projects: []
    };

    const state = { kind: "all", q: "", catalog: FALLBACK, pushed: {}, status: { jobs: {} } };

    const grid = document.getElementById("grid");
    const search = document.querySelector(".search");

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        state.kind = chip.dataset.kind;
        document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
        render();
      });
    });
    search.addEventListener("input", () => {
      state.q = search.value.trim().toLowerCase();
      render();
    });

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function relative(iso) {
      if (!iso) return "";
      const t = new Date(iso).getTime();
      if (Number.isNaN(t)) return "";
      const day = Math.round((Date.now() - t) / 86400000);
      if (day <= 0) return "오늘";
      if (day === 1) return "어제";
      if (day < 14) return day + "일 전";
      return new Date(iso).toISOString().slice(0, 10);
    }

    function statusBlock(p) {
      const job = p.job && state.status.jobs && state.status.jobs[p.job];
      if (!job) return "";
      const klass = job.state === "ok" ? "ok" : job.state === "bad" ? "bad" : "wait";
      const summary = job.summary ? `<span class="run-summary">${esc(job.summary)}</span>` : "";
      const inner = `<span class="run-dot"></span><span class="run-label">${esc(job.label || "")}</span>${summary}`;
      if (job.url) {
        return `<a class="run-status ${klass}" href="${esc(job.url)}" target="_blank" rel="noopener">${inner}</a>`;
      }
      return `<p class="run-status ${klass}">${inner}</p>`;
    }

    function matches(p) {
      if (state.kind !== "all" && p.kind !== state.kind) return false;
      if (!state.q) return true;
      const blob = [p.name, p.blurb, p.gitName, p.note].join(" ").toLowerCase();
      return blob.includes(state.q);
    }

    function render() {
      const items = state.catalog.projects.filter(matches);
      if (!items.length) {
        grid.innerHTML = '<p class="empty">해당하는 프로젝트가 없습니다.</p>';
        return;
      }
      grid.innerHTML = items.map((p) => {
        const pushed = p.gitName && relative(state.pushed[p.gitName]);
        const pills = [
          KIND_LABEL[p.kind] || p.kind,
          p.private ? "비공개" : "",
          p.local ? "PC" : "",
          pushed
        ].filter(Boolean);
        const buttons = [];
        if (p.web) {
          buttons.push(`<a class="btn primary" href="${esc(p.web)}" target="_blank" rel="noopener">${esc(p.webLabel || "웹 열기")}</a>`);
        }
        if (p.git) {
          buttons.push(`<a class="btn ghost" href="${esc(p.git)}" target="_blank" rel="noopener">GitHub</a>`);
        }
        if (p.youtube) {
          buttons.push(`<a class="btn ghost" href="${esc(p.youtube)}" target="_blank" rel="noopener">YouTube</a>`);
        }
        if (p.instagram) {
          buttons.push(`<a class="btn ghost" href="${esc(p.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
        }
        if (!buttons.length && p.local) {
          buttons.push(`<span class="btn ghost">로컬만</span>`);
        }
        buttons.push(`<button type="button" class="btn ghost" data-edit="${esc(p.id)}">수정</button>`);
        return `
          <article class="card" style="--accent:${esc(p.accent || "#215c4a")}">
            <div class="card-head">
              <div class="mark">${esc(p.mark || "·")}</div>
              <div>
                <h2 class="name">${esc(p.name)}</h2>
                <div class="meta">${pills.map((x) => `<span class="pill">${esc(x)}</span>`).join("")}</div>
              </div>
            </div>
            <p class="blurb">${esc(p.blurb)}</p>
            ${statusBlock(p)}
            ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
            <div class="actions">${buttons.join("")}</div>
          </article>`;
      }).join("");
    }

    async function boot() {
      try {
        const res = await fetch("projects.json", { cache: "no-store" });
        if (res.ok) state.catalog = await res.json();
      } catch (_) { /* file:// 로 열면 JSON을 못 읽을 수 있음 */ }
      render();
      try {
        const res = await fetch("status.json", { cache: "no-store" });
        if (res.ok) {
          state.status = await res.json();
          const banner = document.getElementById("run-banner");
          if (banner && state.status.summary) {
            banner.hidden = false;
            banner.textContent = state.status.summary;
            banner.className = "run-banner" + (state.status.ok ? " ok" : " bad");
          }
          render();
        }
      } catch (_) { /* status.json 없어도 목록은 연다 */ }
      try {
        const user = state.catalog.githubUser || "Hyungmo1234";
        const res = await fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=pushed`);
        if (!res.ok) return;
        const repos = await res.json();
        const skip = new Set(state.catalog.skipRepos || []);
        const known = new Set((state.catalog.projects || []).map((p) => p.gitName).filter(Boolean));
        for (const repo of repos) {
          state.pushed[repo.name] = repo.pushed_at;
          if (skip.has(repo.name) || known.has(repo.name)) continue;
          state.catalog.projects.push({
            id: repo.name,
            name: repo.name,
            blurb: repo.description || "GitHub 공개 저장소",
            kind: repo.homepage ? "web" : "study",
            accent: "#6b655c",
            mark: "G",
            web: repo.homepage || "",
            webLabel: "웹 열기",
            git: repo.html_url,
            gitName: repo.name,
            private: false
          });
        }
        render();
      } catch (_) { /* API 한도·오프라인은 무시 */ }
    }

    const modal = document.getElementById("edit-modal");
    const form = document.getElementById("edit-form");
    const titleEl = document.getElementById("edit-title");
    const msgEl = document.getElementById("edit-msg");
    let editTarget = null;
    let editMode = "edit";

    function splitSection(text, heading) {
      const parts = text.split("## " + heading);
      if (parts.length < 2) return "";
      return parts[1].replace(/^## [\s\S]*/, "").trim();
    }

    async function renderInbox() {
      const box = document.getElementById("inbox-list");
      box.textContent = "불러오는 중…";
      try {
        const items = await HMAdmin.listInbox();
        if (!items.length) {
          box.innerHTML = "<p class=\"note\">아직 요청이 없습니다.</p>";
          return;
        }
        box.innerHTML = items.map((item) => {
          const wish = splitSection(item.text, "이렇게 고쳤으면") || item.text;
          const reply = splitSection(item.text, "응답");
          return `<article class="inbox-item">
            <p class="inbox-name">${esc(item.name)}</p>
            <pre>${esc(wish)}</pre>
            ${reply ? `<p class="inbox-reply-label">응답</p><pre>${esc(reply)}</pre>` : `<p class="note">아직 응답 없음</p>`}
          </article>`;
        }).join("");
      } catch (err) {
        box.textContent = err.message || String(err);
      }
    }

    function setMode(mode) {
      editMode = mode;
      modal.querySelectorAll("[data-mode]").forEach((btn) => {
        btn.setAttribute("aria-pressed", String(btn.dataset.mode === mode));
      });
      modal.querySelectorAll("[data-pane]").forEach((pane) => {
        pane.hidden = pane.dataset.pane !== mode;
      });
      const pw = form.password;
      if (window.HMAdmin && HMAdmin.tokenReady) pw.required = false;
      const submit = form.querySelector("[type=submit]");
      submit.hidden = mode === "inbox";
      if (mode === "inbox") renderInbox();
    }

    function showMsg(text, ok) {
      msgEl.hidden = false;
      msgEl.textContent = text;
      msgEl.className = "edit-msg" + (ok ? " ok" : "");
    }

    function openEditor(project) {
      editTarget = project || null;
      titleEl.textContent = project ? project.name : "사이트";
      form.reset();
      if (HMAdmin.token) {
        form.password.required = false;
        form.password.closest("label").hidden = true;
      } else {
        form.password.required = true;
        form.password.closest("label").hidden = false;
      }
      if (project) {
        form.name.value = project.name || "";
        form.blurb.value = project.blurb || "";
        form.note.value = project.note || "";
      }
      const job = project && project.job && state.status.jobs && state.status.jobs[project.job];
      setMode(job && job.state === "bad" ? "wish" : (project ? "edit" : "inbox"));
      if (!project) setMode("inbox");
      msgEl.hidden = true;
      modal.hidden = false;
      (form.password.value ? form.querySelector("[name=wish], [name=name]") : form.password).focus();
    }

    document.getElementById("admin-open").addEventListener("click", () => openEditor(null));
    grid.addEventListener("click", (ev) => {
      const btn = ev.target.closest("[data-edit]");
      if (!btn) return;
      const project = state.catalog.projects.find((p) => p.id === btn.dataset.edit);
      if (project) openEditor(project);
    });
    modal.addEventListener("click", (ev) => {
      if (ev.target === modal || ev.target.closest("[data-close]")) modal.hidden = true;
    });
    modal.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const submit = form.querySelector("[type=submit]");
      submit.disabled = true;
      showMsg("저장하는 중…");
      try {
        await HMAdmin.unlockAdmin(form.password.value);
        HMAdmin.tokenReady = true;
        form.password.required = false;
        if (editMode === "inbox") return;
        if (editMode === "edit") {
          if (!editTarget) throw new Error("바로 수정은 카드에서 열어 주세요.");
          await HMAdmin.saveProjectEdit(editTarget.id, {
            name: form.name.value.trim(),
            blurb: form.blurb.value.trim(),
            note: form.note.value.trim()
          });
          showMsg("올렸습니다. 페이지가 다시 배포되면 반영됩니다.", true);
        } else {
          const wish = form.wish.value.trim();
          if (!wish) throw new Error("고치고 싶은 내용을 적어 주세요.");
          const job = editTarget && editTarget.job && state.status.jobs[editTarget.job];
          const statusLine = job ? `${job.label} · ${job.summary}` : "";
          const path = await HMAdmin.saveWish(editTarget, wish, statusLine);
          showMsg("요청을 남겼습니다. " + path, true);
          form.wish.value = "";
        }
      } catch (err) {
        showMsg(err.message || String(err));
      } finally {
        submit.disabled = false;
      }
    });

    boot();
  </script>
</body>
</html>
