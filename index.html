<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>개인 프로젝트 모음</title>
  <meta name="description" content="Git 저장소와 웹 앱을 한곳에서 열고 들어갑니다." />
  <meta name="theme-color" content="#f3efe7" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f1b16'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' font-family='serif' fill='%23f3efe7'%3E한%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <p class="kicker">
        <span>형모의 작업</span>
        <span class="nav-links">
          <a class="gh" href="resume.html">이력서</a>
          <a class="gh" href="https://github.com/Hyungmo1234?tab=repositories" target="_blank" rel="noopener">GitHub</a>
        </span>
      </p>
      <h1>개인 프로젝트 모음</h1>
    </header>

    <div class="toolbar">
      <div class="chips" role="tablist" aria-label="종류">
        <button class="chip" data-kind="all" aria-pressed="true">전체</button>
        <button class="chip" data-kind="web" aria-pressed="false">웹</button>
        <button class="chip" data-kind="tool" aria-pressed="false">로컬 도구</button>
        <button class="chip" data-kind="study" aria-pressed="false">공부</button>
      </div>
      <input class="search" type="search" placeholder="이름, 설명, 저장소 검색" aria-label="검색" />
    </div>

    <section class="grid" id="grid" aria-live="polite"></section>
  </div>

  <footer class="site-foot">
    <div class="foot-inner">
      <div>
        <p class="foot-name">양형모</p>
        <p class="foot-role">웹 · 자동화 · 개인 프로젝트</p>
      </div>
      <div class="foot-contacts">
        <a href="tel:+821084389060">010-8438-9060</a>
        <a href="mailto:tytyrrr13@gmail.com">tytyrrr13@gmail.com</a>
        <a href="resume.html">이력서</a>
        <a href="https://github.com/Hyungmo1234" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  <script>
    const KIND_LABEL = { web: "웹", tool: "로컬", study: "공부" };
    const FALLBACK = {
      githubUser: "Hyungmo1234",
      skipRepos: ["kkkk", "no"],
      projects: []
    };

    const state = { kind: "all", q: "", catalog: FALLBACK, pushed: {} };

    const grid = document.getElementById("grid");
    const search = document.querySelector(".search");

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        state.kind = chip.dataset.kind;
        document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
        render();
      });
    });
    search.addEventListener("input", () => {
      state.q = search.value.trim().toLowerCase();
      render();
    });

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function relative(iso) {
      if (!iso) return "";
      const t = new Date(iso).getTime();
      if (Number.isNaN(t)) return "";
      const day = Math.round((Date.now() - t) / 86400000);
      if (day <= 0) return "오늘";
      if (day === 1) return "어제";
      if (day < 14) return day + "일 전";
      return new Date(iso).toISOString().slice(0, 10);
    }

    function matches(p) {
      if (state.kind !== "all" && p.kind !== state.kind) return false;
      if (!state.q) return true;
      const blob = [p.name, p.blurb, p.gitName, p.note].join(" ").toLowerCase();
      return blob.includes(state.q);
    }

    function render() {
      const items = state.catalog.projects.filter(matches);
      if (!items.length) {
        grid.innerHTML = '<p class="empty">해당하는 프로젝트가 없습니다.</p>';
        return;
      }
      grid.innerHTML = items.map((p) => {
        const pushed = p.gitName && relative(state.pushed[p.gitName]);
        const pills = [
          KIND_LABEL[p.kind] || p.kind,
          p.private ? "비공개" : "",
          p.local ? "PC" : "",
          pushed
        ].filter(Boolean);
        const buttons = [];
        if (p.web) {
          buttons.push(`<a class="btn primary" href="${esc(p.web)}" target="_blank" rel="noopener">${esc(p.webLabel || "웹 열기")}</a>`);
        }
        if (p.git) {
          buttons.push(`<a class="btn ghost" href="${esc(p.git)}" target="_blank" rel="noopener">GitHub</a>`);
        }
        if (p.youtube) {
          buttons.push(`<a class="btn ghost" href="${esc(p.youtube)}" target="_blank" rel="noopener">YouTube</a>`);
        }
        if (!buttons.length && p.local) {
          buttons.push(`<span class="btn ghost">로컬만</span>`);
        }
        return `
          <article class="card" style="--accent:${esc(p.accent || "#215c4a")}">
            <div class="card-head">
              <div class="mark">${esc(p.mark || "·")}</div>
              <div>
                <h2 class="name">${esc(p.name)}</h2>
                <div class="meta">${pills.map((x) => `<span class="pill">${esc(x)}</span>`).join("")}</div>
              </div>
            </div>
            <p class="blurb">${esc(p.blurb)}</p>
            ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
            <div class="actions">${buttons.join("")}</div>
          </article>`;
      }).join("");
    }

    async function boot() {
      try {
        const res = await fetch("projects.json", { cache: "no-store" });
        if (res.ok) state.catalog = await res.json();
      } catch (_) { /* file:// 로 열면 JSON을 못 읽을 수 있음 */ }
      render();
      try {
        const user = state.catalog.githubUser || "Hyungmo1234";
        const res = await fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=pushed`);
        if (!res.ok) return;
        const repos = await res.json();
        const skip = new Set(state.catalog.skipRepos || []);
        const known = new Set((state.catalog.projects || []).map((p) => p.gitName).filter(Boolean));
        for (const repo of repos) {
          state.pushed[repo.name] = repo.pushed_at;
          if (skip.has(repo.name) || known.has(repo.name)) continue;
          state.catalog.projects.push({
            id: repo.name,
            name: repo.name,
            blurb: repo.description || "GitHub 공개 저장소",
            kind: repo.homepage ? "web" : "study",
            accent: "#6b655c",
            mark: "G",
            web: repo.homepage || "",
            webLabel: "웹 열기",
            git: repo.html_url,
            gitName: repo.name,
            private: false
          });
        }
        render();
      } catch (_) { /* API 한도·오프라인은 무시 */ }
    }

    boot();
  </script>
</body>
</html>
