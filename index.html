<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>개인 프로젝트 모음</title>
  <meta name="description" content="Git 저장소와 웹 앱을 한곳에서 열고 들어갑니다." />
  <meta name="theme-color" content="#f3efe7" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f1b16'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' font-family='serif' fill='%23f3efe7'%3E한%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3efe7;
      --ink: #1f1b16;
      --muted: #6b655c;
      --faint: #8c857a;
      --card: #fffcf8;
      --line: #ddd6cb;
      --fill: #ebe4d8;
      --forest: #215c4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      font-family: Pretendard, "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(900px 380px at 80% -8%, #fffdf8 0%, transparent 58%),
        var(--bg);
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    a { color: inherit; }
    button, input { font: inherit; }
    .wrap { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 88px; }
    header.top {
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
    }
    .kicker {
      margin: 0 0 14px;
      color: var(--forest);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      font-family: Hahmlet, Pretendard, serif;
      font-size: clamp(32px, 5.2vw, 48px);
      font-weight: 500;
      line-height: 1.28;
      letter-spacing: -0.03em;
      margin: 0;
    }
    .gh {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
    }
    .gh:hover { color: var(--ink); border-bottom-color: var(--ink); }
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0 0 24px;
    }
    @media (min-width: 720px) {
      .toolbar {
        flex-direction: row;
        align-items: center;
        gap: 14px 20px;
      }
    }
    .chips { display: flex; flex-wrap: wrap; gap: 4px 2px; }
    .chip {
      appearance: none;
      background: none;
      border: 0;
      color: var(--faint);
      height: 36px;
      padding: 0 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .chip[aria-pressed="true"] {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }
    .search {
      flex: none;
      width: 100%;
      min-width: 0;
      height: 40px;
      padding: 0 2px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      outline: none;
      border-radius: 0;
    }
    @media (min-width: 720px) {
      .search { flex: 1 1 220px; width: auto; }
    }
    .search:focus { border-bottom-color: var(--ink); }
    .search::placeholder { color: var(--faint); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 22px 18px;
      display: flex;
      flex-direction: column;
      min-height: 236px;
      box-shadow: 0 1px 0 rgba(31, 27, 22, 0.03);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(31, 27, 22, 0.06);
    }
    .card-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
    .mark {
      width: 40px; height: 40px; flex: 0 0 auto;
      border-radius: 11px;
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--accent) 14%, var(--fill));
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0;
    }
    .name {
      font-size: 17px;
      font-weight: 700;
      margin: 0;
      line-height: 1.35;
    }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .pill {
      font-size: 11px;
      font-weight: 600;
      color: var(--faint);
      background: var(--fill);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .blurb {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      margin: 0 0 16px;
      flex: 1;
    }
    .note { font-size: 12px; color: var(--faint); margin: -8px 0 14px; line-height: 1.5; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .btn.primary {
      background: var(--ink);
      color: #f7f3ec;
    }
    .btn.primary:hover { background: #3a342c; }
    .btn.ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--line);
    }
    .btn.ghost:hover { color: var(--ink); border-color: #c9c1b4; }
    .empty {
      grid-column: 1 / -1;
      color: var(--muted);
      text-align: center;
      padding: 56px 12px;
    }
    footer {
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      justify-content: space-between;
      line-height: 1.6;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--ink); }
    footer code { font-family: ui-monospace, "Cascadia Code", monospace; font-size: 11px; }
    @media (max-width: 640px) {
      .wrap { width: min(100% - 28px, 1080px); padding-top: 32px; }
      .card { min-height: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <p class="kicker">
        <span>형모의 작업</span>
        <a class="gh" href="https://github.com/Hyungmo1234?tab=repositories" target="_blank" rel="noopener">GitHub</a>
      </p>
      <h1>개인 프로젝트 모음</h1>
    </header>

    <div class="toolbar">
      <div class="chips" role="tablist" aria-label="종류">
        <button class="chip" data-kind="all" aria-pressed="true">전체</button>
        <button class="chip" data-kind="web" aria-pressed="false">웹</button>
        <button class="chip" data-kind="tool" aria-pressed="false">로컬 도구</button>
        <button class="chip" data-kind="study" aria-pressed="false">공부</button>
      </div>
      <input class="search" type="search" placeholder="이름, 설명, 저장소 검색" aria-label="검색" />
    </div>

    <section class="grid" id="grid" aria-live="polite"></section>

    <footer>
      <span>목록은 <code>projects.json</code>에서 고칩니다.</span>
      <a href="https://github.com/Hyungmo1234/Hyungmo1234.github.io">뷰어 저장소</a>
    </footer>
  </div>

  <script>
    const KIND_LABEL = { web: "웹", tool: "로컬", study: "공부" };
    const FALLBACK = {
      githubUser: "Hyungmo1234",
      skipRepos: ["kkkk", "no"],
      projects: []
    };

    const state = { kind: "all", q: "", catalog: FALLBACK, pushed: {} };

    const grid = document.getElementById("grid");
    const search = document.querySelector(".search");

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        state.kind = chip.dataset.kind;
        document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
        render();
      });
    });
    search.addEventListener("input", () => {
      state.q = search.value.trim().toLowerCase();
      render();
    });

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function relative(iso) {
      if (!iso) return "";
      const t = new Date(iso).getTime();
      if (Number.isNaN(t)) return "";
      const day = Math.round((Date.now() - t) / 86400000);
      if (day <= 0) return "오늘";
      if (day === 1) return "어제";
      if (day < 14) return day + "일 전";
      return new Date(iso).toISOString().slice(0, 10);
    }

    function matches(p) {
      if (state.kind !== "all" && p.kind !== state.kind) return false;
      if (!state.q) return true;
      const blob = [p.name, p.blurb, p.gitName, p.note].join(" ").toLowerCase();
      return blob.includes(state.q);
    }

    function render() {
      const items = state.catalog.projects.filter(matches);
      if (!items.length) {
        grid.innerHTML = '<p class="empty">해당하는 프로젝트가 없습니다.</p>';
        return;
      }
      grid.innerHTML = items.map((p) => {
        const pushed = p.gitName && relative(state.pushed[p.gitName]);
        const pills = [
          KIND_LABEL[p.kind] || p.kind,
          p.private ? "비공개" : "",
          p.local ? "PC" : "",
          pushed
        ].filter(Boolean);
        const buttons = [];
        if (p.web) {
          buttons.push(`<a class="btn primary" href="${esc(p.web)}" target="_blank" rel="noopener">${esc(p.webLabel || "웹 열기")}</a>`);
        }
        if (p.git) {
          buttons.push(`<a class="btn ghost" href="${esc(p.git)}" target="_blank" rel="noopener">GitHub</a>`);
        }
        if (p.youtube) {
          buttons.push(`<a class="btn ghost" href="${esc(p.youtube)}" target="_blank" rel="noopener">YouTube</a>`);
        }
        if (!buttons.length && p.local) {
          buttons.push(`<span class="btn ghost">로컬만</span>`);
        }
        return `
          <article class="card" style="--accent:${esc(p.accent || "#215c4a")}">
            <div class="card-head">
              <div class="mark">${esc(p.mark || "·")}</div>
              <div>
                <h2 class="name">${esc(p.name)}</h2>
                <div class="meta">${pills.map((x) => `<span class="pill">${esc(x)}</span>`).join("")}</div>
              </div>
            </div>
            <p class="blurb">${esc(p.blurb)}</p>
            ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
            <div class="actions">${buttons.join("")}</div>
          </article>`;
      }).join("");
    }

    async function boot() {
      try {
        const res = await fetch("projects.json", { cache: "no-store" });
        if (res.ok) state.catalog = await res.json();
      } catch (_) { /* file:// 로 열면 JSON을 못 읽을 수 있음 */ }
      render();
      try {
        const user = state.catalog.githubUser || "Hyungmo1234";
        const res = await fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=pushed`);
        if (!res.ok) return;
        const repos = await res.json();
        const skip = new Set(state.catalog.skipRepos || []);
        const known = new Set((state.catalog.projects || []).map((p) => p.gitName).filter(Boolean));
        for (const repo of repos) {
          state.pushed[repo.name] = repo.pushed_at;
          if (skip.has(repo.name) || known.has(repo.name)) continue;
          state.catalog.projects.push({
            id: repo.name,
            name: repo.name,
            blurb: repo.description || "GitHub 공개 저장소",
            kind: repo.homepage ? "web" : "study",
            accent: "#6b655c",
            mark: "G",
            web: repo.homepage || "",
            webLabel: "웹 열기",
            git: repo.html_url,
            gitName: repo.name,
            private: false
          });
        }
        render();
      } catch (_) { /* API 한도·오프라인은 무시 */ }
    }

    boot();
  </script>
</body>
</html>
