name: Collect run status

on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-status
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect scheduled job status
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN || github.token }}
        run: python scripts/collect_status.py || true
      - name: Commit status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "no status change"
          else
            git commit -m "Refresh scheduled job status"
            git push
          fi
