<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>모르는 단어</title>
  <meta name="description" content="수업을 적고, 모르는 단어를 바로 물어보는 강의 사전" />
  <meta name="theme-color" content="#f4efe6" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c3d38'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='15' font-family='serif' fill='%23f4efe6'%3E단%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <section class="screen" id="setup" aria-labelledby="setup-title">
      <p class="kicker">강의 단어</p>
      <h1 id="setup-title">오늘 어떤 수업인가요?</h1>
      <p class="lead">수업 이름을 먼저 적으면, 그 수업에서 자주 나오는 개념을 펼쳐 둡니다. 그다음 모르는 단어를 대화처럼 물어보세요.</p>
      <form id="class-form" class="class-form">
        <label class="sr" for="class-input">수업 이름</label>
        <input id="class-input" name="lecture" type="text" autocomplete="off" placeholder="예: 스프링 부트, 운영체제, 데이터베이스" required />
        <button type="submit">이 수업으로 시작</button>
      </form>
      <div class="recent" id="recent" hidden>
        <p class="recent-label">최근 수업</p>
        <div class="recent-list" id="recent-list"></div>
      </div>
    </section>

    <section class="screen classroom" id="classroom" hidden>
      <header class="room-top">
        <button type="button" class="back" id="change-class">수업주제</button>
        <div>
          <p class="kicker">지금 듣는 수업</p>
          <h1 id="lecture-title"></h1>
        </div>
      </header>

      <section class="concepts" aria-labelledby="concepts-title">
        <div class="concepts-head">
          <h2 id="concepts-title">이 수업에서 자주 나오는 개념</h2>
          <p id="concepts-hint">눌러서 바로 물어볼 수 있습니다.</p>
        </div>
        <div class="concept-grid" id="concept-grid">
          <p class="soft">수업을 읽고 개념을 고르는 중…</p>
        </div>
      </section>

      <section class="chat" aria-labelledby="ask-title">
        <h2 id="ask-title" class="sr">모르는 단어가 무엇인가요?</h2>
        <div class="log" id="log" role="log" aria-live="polite"></div>
        <form id="ask-form" class="ask-form">
          <label class="sr" for="ask-input">모르는 단어</label>
          <input id="ask-input" type="text" autocomplete="off" placeholder="모르는 단어가 무엇인가요?" />
          <button type="submit">물어보기</button>
        </form>
        <div class="save-row">
          <button type="button" class="ghost" id="publish">깃에 올리기</button>
          <p class="soft" id="save-status">물어본 단어를 노트에 모아 깃에 올립니다.</p>
        </div>
      </section>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
